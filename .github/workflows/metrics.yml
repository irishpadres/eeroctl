name: 📊 Repository Metrics

on:
  # Generate on schedule (daily at 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Generate on push to master
  push:
    branches:
      - master
    paths:
      - ".github/workflows/metrics.yml"
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  metrics:
    # The callee commits the SVG with its own App token; GITHUB_TOKEN only
    # needs read access.
    permissions:
      contents: read
    uses: fulviofreitas/workflow-arsenal/.github/workflows/reusable-metrics.yml@64cd305ccf1cb9991247eb3c0bd7c0b513c6a92a # master
    with:
      repo: eeroctl
      branch: master
    secrets:
      RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
